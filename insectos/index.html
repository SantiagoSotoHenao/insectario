<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Insectos · Crisopa & Sitotroga</title>
<style>
  :root{
    --green:#016631; --green-d:#014E27; --green-t:#0A7A3C; --green-bg:#E9F2EB;
    --gold:#B8860B; --gold-d:#8C6608; --brown:#4A3B21; --egr:#A15C2B;
    --ink:#18201A; --muted:#5f6b60; --line:#DBE3DC; --card:#fff;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; height:100%; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:#F4F7F3; color:var(--ink); -webkit-user-select:none; user-select:none; overscroll-behavior:none; }
  #app { display:flex; flex-direction:column; height:100dvh; }

  .topbar { display:flex; align-items:center; gap:8px; padding:11px 13px; background:var(--green); border-bottom:3px solid var(--gold); color:#fff; flex:0 0 auto; }
  .topbar .idbox { font-size:16px; font-weight:800; color:#fff; }
  .topbar .sub { font-size:12px; color:#CDE6D5; }
  .grow { flex:1; }
  .iconbtn { border:2px solid rgba(255,255,255,.85); background:transparent; border-radius:10px; padding:7px 10px; font-size:14px; font-weight:800; color:#fff; }
  .editflag { font-size:11px; font-weight:800; color:#FCE7B0; }

  .wrap { flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 14px 20px; }
  .sec { font-size:12.5px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; color:var(--green); margin:6px 0 8px; }
  .sec.egr { color:var(--egr); } .sec.sito { color:var(--gold-d); }
  .h1 { font-size:24px; font-weight:800; margin:2px 0 4px; color:var(--green-d); }
  .p { font-size:14px; color:var(--muted); margin:0 0 16px; line-height:1.45; }
  .fl { display:block; font-size:13px; font-weight:800; color:#374151; margin:14px 0 6px; letter-spacing:.2px; }
  .fin { width:100%; border:1.5px solid var(--line); border-radius:12px; padding:14px; font-size:20px; font-weight:600; color:var(--ink); background:#fff; }
  .fin:focus { outline:none; border-color:var(--green); }
  select.fin { -webkit-appearance:none; appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16'><path d='M4 6l4 4 4-4' stroke='%23016631' stroke-width='2' fill='none'/></svg>"); background-repeat:no-repeat; background-position:right 14px center; }

  .brandhead { background:var(--green); border-radius:16px; padding:20px 18px; text-align:center; box-shadow:0 2px 10px rgba(1,78,39,.18); margin-bottom:16px; }
  .brandhead img { width:78%; max-width:290px; height:auto; border-radius:8px; display:inline-block; }
  .brandhead .tagline { color:#CDE6D5; font-size:12px; font-weight:700; letter-spacing:1px; margin-top:12px; text-transform:uppercase; }

  .bigbtn { width:100%; border:none; border-radius:13px; padding:16px; font-size:19px; font-weight:800; margin-top:14px; color:#fff; box-shadow:0 2px 6px rgba(0,0,0,.10); }
  .primary { background:var(--green); } .blue { background:var(--green-t); } .gold { background:var(--gold); }
  .ghost { background:#fff; color:var(--green); border:2px solid var(--green); box-shadow:none; }
  .dark { background:var(--brown); } .red { background:#B0402A; }

  .seg { width:100%; display:flex; align-items:center; gap:14px; border:1.5px solid var(--line); border-radius:14px; padding:17px 16px; font-size:19px; font-weight:800; background:#fff; margin-bottom:11px; box-shadow:0 1px 3px rgba(0,0,0,.05); color:var(--ink); }
  .seg .ico { font-size:23px; } .seg .arw { margin-left:auto; color:#9aa79c; font-weight:700; }

  .cams { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .cam { position:relative; border:1.5px solid var(--line); border-radius:14px; padding:20px 6px; text-align:center; font-size:18px; font-weight:800; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .cam .badge { position:absolute; top:-8px; right:-8px; min-width:24px; height:24px; border-radius:12px; background:var(--green); color:#fff; font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center; padding:0 6px; }
  .cam.done { border-color:var(--green); background:var(--green-bg); }
  .cam.add { border-style:dashed; border-color:var(--green); color:var(--green); }

  .numbox { border:2px solid var(--green); border-radius:14px; padding:6px 14px; margin-bottom:12px; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .numbox .lab { font-size:13.5px; font-weight:800; color:var(--green); letter-spacing:.3px; padding-top:6px; }
  .numbox input { width:100%; border:none; font-size:34px; font-weight:800; color:var(--ink); padding:2px 0 8px; background:transparent; }
  .numbox input:focus { outline:none; }
  .numbox.sm .lab { font-size:12px; } .numbox.sm input { font-size:24px; }
  .numbox.egr { border-color:var(--egr); } .numbox.egr .lab { color:var(--egr); }
  .numbox.sito { border-color:var(--gold); } .numbox.sito .lab { color:var(--gold-d); }
  .numfield { cursor:pointer; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .grid2 .numbox { margin-bottom:10px; }

  .chips { display:flex; flex-wrap:wrap; gap:9px; margin:2px 0 6px; }
  .chip { border:1.5px solid var(--line); background:#fff; color:var(--ink); border-radius:22px; padding:10px 14px; font-size:14px; font-weight:700; }
  .chip.on { background:var(--gold); border-color:var(--gold); color:#fff; }

  .reg { border:1.5px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  .reg .top { display:flex; justify-content:space-between; font-weight:800; font-size:15px; }
  .reg .tag { font-size:11px; font-weight:800; padding:2px 8px; border-radius:10px; color:#fff; }
  .reg .meta { font-size:13px; color:var(--muted); margin-top:4px; }
  .reg .acts { display:flex; gap:16px; margin-top:8px; }
  .reg .lnk { font-weight:800; font-size:13px; border:none; background:none; padding:0; }
  .reg .edit { color:var(--green-t); } .reg .del { color:#B0402A; }
  .syncdot { font-size:11px; font-weight:800; } .syncdot.no { color:var(--gold-d); } .syncdot.ok { color:var(--green); }

  .rowitem { display:flex; align-items:center; gap:10px; border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; font-weight:700; background:#fff; }
  .rowitem .x { margin-left:auto; color:#B0402A; font-weight:800; border:none; background:none; font-size:18px; }

  .footer { display:grid; grid-template-columns:repeat(3,1fr); border-top:1.5px solid var(--line); background:#fff; flex:0 0 auto; padding-bottom:env(safe-area-inset-bottom); }
  .fbtn { padding:13px 0; text-align:center; font-size:19px; font-weight:800; color:var(--ink); background:#fff; border:none; border-right:1px solid var(--line); }
  .fbtn:last-child { border-right:none; }
  .fbtn .lbl { display:block; font-size:10px; font-weight:800; letter-spacing:.4px; margin-top:2px; }
  .fbtn.on { background:var(--green); color:#fff; }

  #kp:empty { display:none; }
  .kpmask { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:60; }
  .kpsheet { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:3px solid var(--green); border-radius:18px 18px 0 0; padding:14px 14px calc(14px + env(safe-area-inset-bottom)); z-index:61; }
  .kplab { font-size:13px; font-weight:800; color:var(--green); letter-spacing:.3px; margin-bottom:6px; text-transform:uppercase; }
  .kpshow { font-size:40px; font-weight:800; text-align:center; border:2px solid var(--green); border-radius:14px; padding:10px; min-height:64px; margin-bottom:12px; color:var(--ink); }
  .kpgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
  .kpgrid button { border:1.5px solid var(--line); background:#fff; color:var(--ink); border-radius:13px; padding:16px 0; font-size:26px; font-weight:800; }
  .kpgrid button.del { background:#F1EFE8; }
  .kprow { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
  .kprow button { border-radius:13px; padding:15px 0; font-size:18px; font-weight:800; border:none; }
  .kprow .cancel { background:#fff; border:2px solid var(--green); color:var(--green); } .kprow .ok { background:var(--green); color:#fff; }

  #toast { position:fixed; left:50%; bottom:78px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:11px 18px; border-radius:24px; font-size:15px; font-weight:700; opacity:0; pointer-events:none; transition:opacity .18s; z-index:70; }
  #toast.show { opacity:1; }

  /* ---- opciones rápidas del selector numérico ---- */
  .kpsheet { max-height:88vh; display:flex; flex-direction:column; }
  .optscroll { flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; margin:10px 0 2px; min-height:0; }
  .opts { display:grid; grid-template-columns:repeat(5,1fr); gap:7px; }
  .opts .opt { border:1.5px solid var(--line); background:#fff; color:var(--ink); border-radius:11px; padding:13px 0; font-size:18px; font-weight:800; }
  .opts .opt.on { background:var(--green); border-color:var(--green); color:#fff; }
  .kprow.tres { grid-template-columns:1fr 1fr 1fr; }
  .kprow .clr { background:#fff; border:2px solid var(--line); color:var(--muted); }
  .kpotro { width:100%; border:2px dashed var(--green); background:#fff; color:var(--green); border-radius:13px; padding:14px; font-size:17px; font-weight:800; }
  .kphint { font-size:12px; color:var(--muted); margin:10px 0 0; text-align:center; }

  /* ---- cronómetro ---- */
  .clock { font-size:48px; font-weight:800; text-align:center; border:2px solid var(--green); border-radius:16px; padding:10px; margin:8px 0; letter-spacing:2px; color:var(--ink); }
  .clock.run { border-color:var(--gold); background:#FFFBF0; }
  .ctrlrow { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .green { background:var(--green); } .amber { background:var(--gold); }
  .bigbtn.mini { padding:12px; font-size:16px; margin-top:10px; }

  /* ---- barra fija de cronómetro activo ---- */
  #tbar { display:none; }
  #tbar.show { display:flex; position:fixed; left:10px; right:10px; bottom:calc(64px + env(safe-area-inset-bottom));
    align-items:center; gap:10px; background:var(--brown); color:#fff; border-radius:14px;
    padding:10px 12px; font-size:14px; font-weight:800; z-index:58; box-shadow:0 3px 12px rgba(0,0,0,.25); }
  #tbar .tclock { font-size:19px; letter-spacing:1px; margin-left:auto; }
  #tbar .tpause { border:2px solid rgba(255,255,255,.8); background:transparent; color:#fff; border-radius:10px; padding:6px 10px; font-weight:800; font-size:13px; }
  body:has(#tbar.show) #toast { bottom:132px; }

  /* ---- lote de cámaras ---- */
  .camcard { border:1.5px solid var(--line); border-radius:14px; padding:10px 12px 4px; margin-bottom:10px; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  .camcard.dup { border-color:#B0402A; }
  .cch { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
  .cnum { border:none; background:var(--green-bg); color:var(--green-d); font-weight:800; font-size:16px; padding:9px 12px; border-radius:10px; }
  .cch .rm { margin-left:auto; border:none; background:none; color:#B0402A; font-weight:800; font-size:17px; }
  .chip.sm { padding:8px 11px; font-size:13px; }

  /* ---- fotos de las etapas ---- */
  .seg .ico { display:flex; }
  .seg .ico img { width:42px; height:42px; border-radius:11px; object-fit:cover; display:block; box-shadow:0 1px 3px rgba(0,0,0,.18); }
  .numbox .lab { display:flex; align-items:center; gap:8px; }
  .labimg { width:28px; height:28px; border-radius:7px; object-fit:cover; flex:0 0 auto; }
  .sec.conimg { display:flex; align-items:center; gap:8px; }
  .sec.conimg img { width:26px; height:26px; border-radius:6px; object-fit:cover; }
  .camcard.ok { border-color:var(--green); background:var(--green-bg); }
  .okflag { font-size:11px; font-weight:800; color:var(--green); }
  /* --- añadidos v3 --- */
  .camwrap { position:relative; }
  .serblk { border:1.5px solid var(--green); border-radius:14px; padding:12px; margin:10px 0; background:#fff; }
  .serblk .sn { font-weight:800; font-size:16px; }
  .serblk .sm2 { font-size:12.5px; color:#555; margin:3px 0 8px; }
  .serblk .row { display:flex; gap:8px; }
  .serblk .row .bigbtn { margin:0; flex:1; }
  details.cerr summary { font-weight:800; font-size:13px; color:#555; margin:14px 0 6px; cursor:pointer; }
  .camwrap .cam { width:100%; }
  .camx { position:absolute; top:-7px; left:-7px; width:24px; height:24px; border-radius:12px; border:none;
          background:#B0402A; color:#fff; font-size:13px; font-weight:800; line-height:1; padding:0;
          display:flex; align-items:center; justify-content:center; box-shadow:0 1px 3px rgba(0,0,0,.25); }
  .sesion { border:1.5px solid var(--line); border-radius:14px; padding:14px; background:#fff; margin-bottom:14px; }
  .sesion .t { font-size:17px; font-weight:800; color:var(--green-d); }
  .sesion .d { font-size:13px; color:var(--muted); margin-top:4px; }
  .warnbox { border:1.5px solid #E5C07B; background:#FDF6E3; border-radius:12px; padding:12px; font-size:13px; color:#6B5312; margin-bottom:12px; line-height:1.45; }

  /* --- panel de errores y diagnóstico --- */
  #fatal { display:none; }
  #fatal.show { display:block; position:fixed; inset:0; z-index:9999; overflow:auto;
    background:#fff; padding:18px; font:13px/1.5 -apple-system,system-ui,sans-serif; }
  #fatal h3 { color:#8a1c1c; font-size:17px; margin:0 0 4px; }
  #fatal pre { white-space:pre-wrap; word-break:break-word; background:#fff3f3;
    border:1px solid #f0c0c0; border-radius:8px; padding:12px; font:12px monospace; color:#8a1c1c; }
  #fatal .hint { color:#5f6b60; margin:10px 0; }
  #fatal button { width:100%; border:none; border-radius:12px; padding:14px;
    font-size:16px; font-weight:800; color:#fff; background:#016631; margin-top:10px; }
  #diag { display:none; }
  #diag.show { display:block; position:fixed; inset:0; z-index:9998; overflow:auto;
    background:#F4F7F3; padding:16px; font:14px/1.5 -apple-system,system-ui,sans-serif; }
  #diag h3 { color:#014E27; font-size:19px; margin:0 0 12px; }
  #diag .fila { display:flex; gap:10px; padding:10px 0; border-bottom:1px solid #DBE3DC; }
  #diag .fila b { flex:0 0 44%; font-weight:800; color:#374151; }
  #diag .ok { color:#016631; font-weight:800; }
  #diag .mal { color:#B0402A; font-weight:800; }
  #diag button { width:100%; border:none; border-radius:12px; padding:14px; font-size:16px;
    font-weight:800; color:#fff; background:#016631; margin-top:14px; }
  #diag .gris { background:#4A3B21; }
  #verbtn { position:fixed; right:8px; bottom:calc(64px + env(safe-area-inset-bottom));
    z-index:57; border:1.5px solid var(--line); background:rgba(255,255,255,.94); color:var(--muted);
    border-radius:9px; padding:5px 9px; font-size:10px; font-weight:800; }
</style>

<div id="diag"></div>
<script>
/* Verificador: si algo falla, se ve en pantalla y no queda una página en blanco. */
window.__APP = "insectos"; window.__VER = "2026-10-14.11"; window.__fallas = [];
function mostrarFalla(titulo, detalle){
  window.__fallas.push(titulo + " :: " + detalle);
  var d = document.getElementById("fatal");
  if(!d) { alert(titulo + "\n\n" + detalle); return; }
  d.className = "show";
  d.innerHTML = '<h3>Se detuvo la app</h3>'
    + '<div class="hint">Los datos que ya habías guardado NO se perdieron: siguen en el celular. '
    + 'Muéstrale esta pantalla a quien te ayude con la app.</div>'
    + '<pre>' + String(titulo + "\n\n" + detalle).replace(/</g,"&lt;") + '\n\nversion ' + window.__VER + '</pre>'
    + '<button onclick="location.reload()">Volver a intentar</button>';
}
window.onerror = function(m,u,l,c,e){ mostrarFalla("Error en el arranque", m + "\nlinea " + l + ", columna " + c); return false; };
window.addEventListener("unhandledrejection", function(ev){
  mostrarFalla("Quedó una tarea sin resolver", (ev.reason && ev.reason.message) || String(ev.reason));
});
</script>

<div id="app"></div>
<div id="kp"></div>
<div id="tbar"></div>
<div id="toast"></div>
<script>
/* --- diagnostico: si algo falla, se ve en pantalla en vez de quedar en blanco --- */
(function(){
  function mostrar(t){
    var d=document.getElementById('app')||document.body;
    d.innerHTML='<pre style="white-space:pre-wrap;padding:14px;margin:0;font:12px/1.5 monospace;'
      +'color:#8a1c1c;background:#fff3f3;border:1px solid #f0c0c0;border-radius:8px">'+t+'</pre>';
  }
  window.onerror=function(m,u,l,c,e){
    mostrar('ERROR DE JAVASCRIPT\n\n'+m+'\n\nlinea '+l+', columna '+c+'\n\n'+((e&&e.stack)||''));
    return false;
  };
  window.addEventListener('unhandledrejection',function(ev){
    mostrar('PROMESA RECHAZADA\n\n'+((ev.reason&&ev.reason.stack)||ev.reason));
  });
  setTimeout(function(){
    var a=document.getElementById('app');
    if(a && !a.innerHTML.trim()){
      mostrar('La pagina cargo pero la interfaz quedo vacia (sin error de JS).\n\n'
        +'protocolo: '+location.protocol+'\npuente google.script: '
        +(typeof google!=='undefined' && google.script ? 'SI' : 'NO')
        +'\nlocalStorage: '+(function(){try{localStorage.setItem('_t','1');localStorage.removeItem('_t');return 'SI';}catch(e){return 'NO ('+e.name+')';}})()
        +'\n\n'+navigator.userAgent);
    }
  },2500);
})();

const MODULO = "Cría de insectos";
const OTROS = "Otro ¿cuál?";

/* registros de producción que llevan la columna "semana" */
const TIPOS_SEMANA = {camara:1, cosecha:1, sito_huevo:1};
function semanaDe(e){ if(!TIPOS_SEMANA[e.tipo]) return "";
  return semanaISO(e.tipo==="sito_huevo" && e.fecha_cosecha ? e.fecha_cosecha : e.fecha); }
/* SEMANA DEL AÑO (ISO 8601: semanas de lunes a domingo, 1 a 52/53).
   No se pregunta: se calcula sola desde la fecha del registro y viaja en la
   columna "semana" de las hojas de producción. */
function semanaISO(f){
  const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(f||"")); if(!m) return "";
  const d=new Date(Date.UTC(+m[1],+m[2]-1,+m[3])); const dia=d.getUTCDay()||7;
  d.setUTCDate(d.getUTCDate()+4-dia);
  const ini=new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return Math.ceil(((d-ini)/86400000+1)/7);
}

const GRUPOS_DEFAULT = ["General", "Experimental 1", "Experimental 2", "Experimental 3"];
/* [ valor que se guarda , texto del boton grande , texto del boton chico ] */

const LS_KEY = "insectos_crisopa_sitotroga_v1";

let view = "config";
let draft = null, editing = null, curCam = null;

function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function load(){ try{ const r=localStorage.getItem(LS_KEY); if(r){ state=Object.assign({camaras:[],grupos:GRUPOS_DEFAULT.slice(),series:{}}, JSON.parse(r)); if(!state.series) state.series={}; return true; } }catch(e){} return false; }
/* Fecha de HOY en hora local. Con toISOString() pelado, despues de las 7 p.m.
   el celular contestaba con la fecha de MANANA, porque UTC va 5 h adelante
   de Colombia. Esto afectaba la fecha que sugiere la app al abrir sesion
   y la fecha que lleva el id de cada registro. */
function today(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function nowHM(){ return new Date().toTimeString().slice(0,5); }
/* El id lleva la FECHA y un código fijo de este teléfono. Así dos personas que
   registran el mismo día —o la misma tanda dentro de 30 días— nunca chocan:
   aunque la parte aleatoria se repitiera, la fecha y el teléfono la separan. */
const DKEY = LS_KEY + "_dev";
const DEV = (function(){ let d=null; try{ d=localStorage.getItem(DKEY); }catch(e){}
  if(!d){ d=Math.random().toString(36).slice(2,6); try{ localStorage.setItem(DKEY,d); }catch(e){} } return d; })();
let _seq = 0;   // contador propio: dos ids del mismo teléfono NUNCA se repiten, ni en el mismo milisegundo
function uid(){ return today()+"-"+DEV+"-"+Date.now().toString(36)+"-"+((_seq++).toString(36))+Math.random().toString(36).slice(2,5); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
const app = document.getElementById("app");
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1400); }
function unsynced(){ return state.entries.filter(e=>!e.synced); }
function opts(arr,sel){ return arr.map(v=>`<option ${v===sel?'selected':''}>${v}</option>`).join(""); }
function esc(s){ return String(s==null?"":s).replace(/"/g,"&quot;"); }

/* =========================================================================
   CRONÓMETROS  —  varios a la vez, sobreviven a recargas y pantalla apagada
   ========================================================================= */
const TKEY = LS_KEY + "_timers";
let timers = {};
function tSave(){ try{ localStorage.setItem(TKEY, JSON.stringify(timers)); }catch(e){} }
function tLoad(){ try{ const r=localStorage.getItem(TKEY); if(r) timers=JSON.parse(r)||{}; }catch(e){ timers={}; } }
function T(id){ if(!timers[id]) timers[id]={run:false,start:null,accum:0,t0:null,label:""}; return timers[id]; }
function tMs(id){ const t=T(id); return t.accum + (t.run && t.start ? (Date.now()-t.start) : 0); }
function tMin(id){ return Math.max(1, Math.round(tMs(id)/60000)); }
function tStart(id,label){ const t=T(id); if(t.run) return; t.run=true; t.start=Date.now(); if(!t.t0) t.t0=nowHM(); if(label) t.label=label; tSave(); }
function tPause(id){ const t=T(id); if(t.run){ t.accum += Date.now()-t.start; t.run=false; t.start=null; } tSave(); }
function tReset(id){ delete timers[id]; tSave(); }
function fmtClock(ms){ const s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor((s%3600)/60), q=s%60;
  return (h?String(h).padStart(2,"0")+":":"")+String(m).padStart(2,"0")+":"+String(q).padStart(2,"0"); }
function fmtDur(min){ const h=Math.floor(min/60), m=min%60; return h? (h+" h "+m+" min") : (m+" min"); }

/* bloque reutilizable: cronómetro + duración a mano (misma casilla) */
function bloqueTiempo(id,label){
  const t=T(id), ms=tMs(id);
  let ctrl;
  if(!t.run && !t.accum) ctrl=`<button class="bigbtn green" data-tact="start" data-tid="${id}">▶ Iniciar cronómetro</button>`;
  else if(t.run)         ctrl=`<div class="ctrlrow"><button class="bigbtn amber" data-tact="pause" data-tid="${id}">⏸ Pausar</button><button class="bigbtn red" data-tact="stop" data-tid="${id}">⏹ Terminar</button></div>`;
  else                   ctrl=`<div class="ctrlrow"><button class="bigbtn green" data-tact="start" data-tid="${id}">▶ Reanudar</button><button class="bigbtn red" data-tact="stop" data-tid="${id}">⏹ Terminar</button></div>`;
  return `<div class="sec">⏱ Tiempo de la tarea (opcional)</div>
      <div class="clock ${t.run?'run':''}" data-clock="${id}">${fmtClock(ms)}</div>
      ${ctrl}
      ${numField('duracion_min','DURACIÓN (min) — la llena el cronómetro o la pones tú','dec')}`;
}
function bindTiempo(label){
  document.querySelectorAll("[data-tact]").forEach(b=> b.onclick=()=>{
    const id=b.dataset.tid, a=b.dataset.tact;
    if(a==="start") tStart(id,label);
    if(a==="pause") tPause(id);
    if(a==="stop"){
      tPause(id); const m=tMin(id);
      if(m>240 && !confirm("El cronómetro marca "+fmtDur(m)+".\n\n¿Es correcto? Si se te olvidó pararlo, cancela y escribe la duración a mano.")){ render(); return; }
      draft.duracion_min=String(m); draft.hora_inicio=T(id).t0||""; draft.hora_fin=nowHM();
    }
    render(); });
}
/* barra flotante: recuerda que hay un cronómetro corriendo desde cualquier pantalla */
function drawTBar(){
  const el=document.getElementById("tbar"); if(!el) return;
  const act=Object.keys(timers).filter(id=>timers[id].run);
  if(!act.length){ el.className=""; el.innerHTML=""; return; }
  const id=act[0], t=timers[id];
  el.className="show";
  el.innerHTML=`<span>⏱</span><span>${t.label||"Tarea"}</span>
    <span class="tclock" data-clock="${id}">${fmtClock(tMs(id))}</span>
    <button class="tpause" id="tbarp">⏸</button>`;
  document.getElementById("tbarp").onclick=()=>{ tPause(id); render(); };
}

/* =========================================================================
   SELECTOR NUMÉRICO: primero opciones rápidas, el teclado en "Otro número"
   ========================================================================= */
let kp = { key:null, mode:'int', buf:'', label:'', onOk:null };
const kpEl = ()=>document.getElementById("kp");

function openKeypad(key,mode,label,onOk){
  const cur=(key&&draft&&draft[key]!=null&&draft[key]!=='')?String(draft[key]):'';
  kp={key,mode:mode||'int',buf:cur,label:label||'',onOk:onOk||null,modo:'teclado'};
  drawPicker();
}
function closeKeypad(){ kpEl().innerHTML=""; }
function commitVal(v){ const cb=kp.onOk, k=kp.key; closeKeypad(); if(cb) cb(v); else if(k&&draft) draft[k]=v; render(); }
function drawPicker(){ drawKeypad(); }

function drawKeypad(){
  const dot = kp.mode==='dec' ? `<button data-k=".">.</button>` : `<button data-k="" style="visibility:hidden"></button>`;
  kpEl().innerHTML = `<div class="kpmask" id="kpmask"></div><div class="kpsheet">
    <div class="kplab">${kp.label}</div><div class="kpshow">${kp.buf||"0"}</div>
    <div class="kpgrid">${[1,2,3,4,5,6,7,8,9].map(d=>`<button data-k="${d}">${d}</button>`).join("")}${dot}<button data-k="0">0</button><button class="del" data-k="del">⌫</button></div>
    <div class="kprow"><button class="cancel" id="kpcancel">Cancelar</button><button class="ok" id="kpok">Listo</button></div></div>`;
  document.getElementById("kpmask").onclick=closeKeypad;
  document.getElementById("kpcancel").onclick=closeKeypad;
  document.getElementById("kpok").onclick=()=>commitVal(kp.buf);
  kpEl().querySelectorAll(".kpgrid button").forEach(b=> b.onclick=()=>{ const k=b.dataset.k;
    if(k==="del") kp.buf=kp.buf.slice(0,-1);
    else if(k===".") { if(!kp.buf.includes(".")) kp.buf=(kp.buf||"0")+"."; }
    else if(k!=="") { if(kp.buf.replace(".","").length<7) kp.buf+=k; }
    drawKeypad(); });
}
function numField(key,label,mode,cls,img){ const v=(draft&&draft[key]!=null?draft[key]:"");
  return `<div class="numbox ${cls||''}"><div class="lab">${img?`<img class="labimg" src="${img}" alt="">`:''}${label}</div>
    <input class="numfield" readonly inputmode="none" data-key="${key}" data-mode="${mode||'int'}" data-label="${esc(label)}" value="${esc(v)}" placeholder="—"></div>`; }
function bindNum(){ document.querySelectorAll(".numfield").forEach(el=> el.onclick=()=> openKeypad(el.dataset.key, el.dataset.mode, el.dataset.label)); }
function bindTxt(){ document.querySelectorAll("[data-txt]").forEach(el=> el.oninput=()=>{ draft[el.dataset.txt]=el.value; }); }
function bindSelects(){ document.querySelectorAll("select[data-key]").forEach(el=> el.onchange=()=>{ draft[el.dataset.key]=el.value; }); }

/* =========================================================================
   DESPLEGABLE CON "OTRA / OTRO ¿CUAL?"
   Sirve para cualquier lista que pueda crecer con el tiempo: fincas, mixes,
   actividades, estados, tipos de lavado. Si el operario escoge la ultima
   opcion, aparece una casilla de texto y lo que escriba es lo que se guarda
   en el campo. Mientras no escriba nada, el campo queda con el valor
   "Otra ¿cual?", que es lo que revisa faltaOtro() al guardar.
   ========================================================================= */
function selOtro(key, label, lista){
  const val = draft[key]||"";
  const enLista = lista.indexOf(val)>=0;
  const esOtro  = (val===OTROS) || (val!=="" && !enLista);
  return `<label class="fl">${label}</label>
    <select class="fin" data-selotro="${key}">${opts(lista.concat([OTROS]), esOtro?OTROS:val)}</select>
    ${esOtro?`<input class="fin" style="margin-top:8px" data-txtotro="${key}" value="${esc(val===OTROS?"":val)}" placeholder="Escribe cual">`:''}`;
}
function bindSelOtro(alCambiar){
  document.querySelectorAll("[data-selotro]").forEach(s=> s.onchange=()=>{
    const k=s.dataset.selotro; draft[k]=s.value;
    if(alCambiar) alCambiar(k, s.value);
    render(); });
  document.querySelectorAll("[data-txtotro]").forEach(t=> t.oninput=()=>{
    draft[t.dataset.txtotro] = t.value.trim() || OTROS; });
}
/* true si alguno de los campos quedo en "Otra ¿cual?" sin escribir nada */
/* Si se escogió "Otro ¿cuál?" y no se escribió cuál, se guarda el valor indicado
   (por defecto "Otro"). Nada de esto bloquea el guardado. */
function otroSinNombre(k, valor){ if(draft[k]===OTROS) draft[k]=(valor===undefined?"Otro":valor); }
function faltaOtro(){
  for(let i=0;i<arguments.length;i++) if(draft[arguments[i]]===OTROS) return true;
  return false;
}

/* =========================================================================
   SERIES — varias cámaras a la vez (cámaras de larvas y cosecha detallada)
   Una serie es un conjunto de cámaras con nombre propio (grupo, tratamiento,
   experimento o día de inoculación). Cada cámara es una fila propia en el
   Sheet y se guarda sola apenas tiene un dato.
   · Valores "para todas": escriben el mismo valor en cada cámara.
   · Nombre de la serie y anotación: van en TODAS las filas.
   · Insumos (huevo inoculado, alimento) se pueden poner "para todas";
     los resultados (huevo cosechado, cocones, adultos) son de cada cámara
     y la serie muestra su SUMA.
   · En "general", los resultados del grupo (cocones, larvas contadas, adultos)
     se escriben como TOTAL y se dividen por igual entre las cámaras.
   · Datos de la serie completa (tiempo, calibración…): solo en la
     primera fila, para no sumarlos varias veces.
   La columna interna lote_id identifica la serie (se dejó con ese nombre
   para no tocar los encabezados que ya existen en el Sheet).
   ========================================================================= */
const SERIES={
  camara:{ tipo:"camara", titulo:"Cámaras de larvas", timer:"camaras_lote", vuelve:"camaras", agregaLista:true, estadio:true,
    campos:[
      {k:"huevos_inoculados_g", lab:"HUEVO CRISOPA (g)", img:"huevo",      todas:true},
      {k:"alimento_g",          lab:"SITOTROGA (g)",     img:"huevo_sito", todas:true},
      {k:"cocones",             lab:"COCONES",           img:"cocon",      total:true, divide:true},
      /* larvas_iniciales: la columna se conserva; en la app se llama "larvas contadas" */
      {k:"larvas_iniciales",    lab:"LARVAS CONTADAS",   img:"larva",      total:true, divide:true},
      {k:"adultos_obtenidos",   lab:"ADULTOS OBTENIDOS", img:"adulto",     total:true, divide:true} ],
    serie:[],
    serieNota:"",
    extra:()=>({modo:"detallada", n_camaras:"1"}) },
  cosecha:{ tipo:"cosecha", titulo:"Cosecha detallada", timer:"cosecha_serie", vuelve:"cosecha_menu", agregaLista:false, estadio:false,
    campos:[
      {k:"gramos",         lab:"HUEVO COSECHADO (g)", img:"huevo",  total:true},
      {k:"vivos_total",    lab:"VIVOS · TOTAL",       img:"adulto", total:true},
      {k:"vivos_hembra",   lab:"VIVOS · HEMBRAS",     img:"adulto", total:true},
      {k:"muertos_total",  lab:"MUERTOS · TOTAL",                   total:true},
      {k:"muertos_hembra", lab:"MUERTOS · HEMBRAS",                 total:true} ],
    serie:[ {k:"muestra_g",lab:"MUESTRA PESADA (g)"}, {k:"muestra_huevos",lab:"HUEVOS CONTADOS EN LA MUESTRA"} ],
    serieNota:"Calibración huevos por gramo (opcional): pesa una pizca de huevo y cuenta cuántos tiene.",
    /* los datos de cada cámara son resultados: NO hay "para todas"; el total de la serie es la suma */
    extra:()=>({modo:"detallada", camaras_cosechadas:"1"}) }
};
let serieKind=null;
/* Machos = total − hembras (se calcula en el libro). Los adultos que no se
   pudieron sexar quedan dentro de "machos", sabiendo que pueden ser hembras. */
function hembrasMal(o){
  if(o.vivos_hembra!=="" && o.vivos_hembra!=null && o.vivos_total!=="" && o.vivos_total!=null && +o.vivos_hembra > +o.vivos_total) return "las hembras vivas superan el total de vivos";
  if(o.muertos_hembra!=="" && o.muertos_hembra!=null && o.muertos_total!=="" && o.muertos_total!=null && +o.muertos_hembra > +o.muertos_total) return "las hembras muertas superan el total de muertos";
  return "";
}
function SD(){ return SERIES[serieKind]; }
/* pide el rango: desde la cámara A hasta la cámara B (ej.: 60 a 69) */
function pedirRango(kind,vista){
  openKeypad("desde","int","Serie · desde la cámara N.º",(a)=>{
    const d=parseInt(a,10);
    if(isNaN(d)){ toast("Pon el número de la primera cámara"); return; }
    setTimeout(()=> openKeypad("hasta","int","Serie · hasta la cámara N.º (empieza en "+d+")",(b)=>{
      const h=parseInt(b,10);
      if(isNaN(h) || h<d){ toast("La última cámara debe ser "+d+" o mayor"); return; }
      if(h-d+1>60){ toast("Máximo 60 cámaras por serie"); return; }
      const nums=[]; for(let c=d;c<=h;c++) nums.push(String(c));
      startSerie(kind,nums); view=vista||"serie"; render(); }),0);
  });
}
function startSerie(kind,nums){
  serieKind=kind; editing=null;
  const sd=SERIES[kind];
  draft={ lote_id:uid(), n:String(nums.length), grupo:"", nota:"", duracion_min:"", hora_inicio:"", hora_fin:"" };
  sd.campos.forEach(c=> draft["all_"+c.k]="");
  sd.serie.forEach(c=> draft[c.k]="");
  nums.forEach((c,i)=>{ draft["it"+i+"_camara"]=c; draft["it"+i+"_id"]=""; draft["it"+i+"_instar"]="";
    sd.campos.forEach(f=> draft["it"+i+"_"+f.k]=""); });
}
function keysCaja(){ return ["camara","id","instar"].concat(SD().campos.map(f=>f.k)); }
function cajasDeSerie(){ const sd=SD(); return draft&&draft.lote_id ? state.entries.filter(e=>e.lote_id===draft.lote_id && e.tipo===sd.tipo && e.fecha===state.fecha) : []; }
/* Registro de series de larvas: nombre, fecha de inicio, cámaras y estadio de
   cada una. Una cámara pertenece a UNA serie abierta: si entra a otra serie,
   sale de la anterior (nuevo ciclo). */
function registrarSerie(){
  if(serieKind!=="camara" || !draft) return;
  const id=draft.lote_id, n=parseInt(draft.n,10)||0;
  let r=state.series[id];
  if(!r){ if(!cajasDeSerie().length) return; r=state.series[id]={nombre:"", inicio:state.fecha, camaras:[], est:{}, cerrada:false}; }
  const nums=[]; for(let i=0;i<n;i++){ const c=String(draft["it"+i+"_camara"]||""); if(c) nums.push(c);
    const ins=draft["it"+i+"_instar"]; if(c && ins) r.est[c]=ins; }
  if(!nums.length){ delete state.series[id]; return; }
  r.nombre=draft.grupo||""; r.camaras=nums;
  Object.keys(state.series).forEach(k=>{ if(k===id) return; const o=state.series[k]; if(o.cerrada) return;
    o.camaras=o.camaras.filter(c=> nums.indexOf(String(c))<0);
    if(!o.camaras.length) delete state.series[k]; });
}
function seriesAbiertas(){ return Object.keys(state.series).filter(k=>!state.series[k].cerrada)
  .sort((a,b)=> (state.series[b].inicio||"").localeCompare(state.series[a].inicio||"")); }
function diasDesde(f){ const a=Date.parse(f), b=Date.parse(state.fecha); return (isNaN(a)||isNaN(b))? "" : Math.round((b-a)/86400000); }
function estadioSerie(r){ const v=r.camaras.map(c=>r.est[c]).filter(Boolean); if(!v.length) return "";
  const cuenta={}; v.forEach(x=>cuenta[x]=(cuenta[x]||0)+1);
  const top=Object.keys(cuenta).sort((a,b)=>cuenta[b]-cuenta[a])[0];
  return cuenta[top]===r.camaras.length ? top : top+" (la mayoría)"; }
/* abre una serie que ya existe, con sus cámaras y lo que ya se anotó HOY */
function abrirSerie(id,vista){
  const r=state.series[id]; if(!r) return;
  startSerie("camara", r.camaras.map(String));
  draft.lote_id=id; draft.grupo=r.nombre||"";
  const hoy=cajasDeSerie(), sd=SD();
  const n=parseInt(draft.n,10)||0;
  for(let i=0;i<n;i++){
    const e=hoy.find(x=>String(x.camara)===String(draft["it"+i+"_camara"])); if(!e) continue;
    draft["it"+i+"_id"]=e.id; draft["it"+i+"_instar"]=e.instar||"";
    sd.campos.forEach(f=> draft["it"+i+"_"+f.k]=e[f.k]||""); }
  const pos={}; r.camaras.forEach((c,i)=> pos[String(c)]=i);
  hoy.sort((a,b)=> (pos[String(a.camara)]??999)-(pos[String(b.camara)]??999));
  if(hoy.length){ const p=hoy[0]; ["nota","duracion_min","hora_inicio","hora_fin"].concat(sd.serie.map(c=>c.k)).forEach(k=> draft[k]=p[k]||""); }
  view=vista||"serie"; render();
}
function sincronizarSerie(){
  const sd=SD(), del=cajasDeSerie();
  const pos={}; for(let i=0;i<(parseInt(draft.n,10)||0);i++) pos[String(draft["it"+i+"_camara"]||"")]=i;
  del.sort((a,b)=> (pos[String(a.camara)]??999)-(pos[String(b.camara)]??999));
  del.forEach((e,k)=>{
    e.grupo = draft.grupo||"";                    // rótulo: en todas las filas
    e.nota  = draft.nota||"";                     // la anotación aplica a TODAS las cámaras de la serie
    sd.serie.forEach(c=> e[c.k] = k===0 ? (draft[c.k]||"") : "");
    e.duracion_min  = k===0 ? (draft.duracion_min||"") : "";
    e.hora_inicio   = k===0 ? (draft.hora_inicio||"") : "";
    e.hora_fin      = k===0 ? (draft.hora_fin||"") : "";
    e.unidades_lote = k===0 ? String(del.length) : "";
    e.synced=false;
  });
  registrarSerie();
}
function guardarCajaSerie(i,silencio){
  const sd=SD(), n=parseInt(draft.n,10)||0;
  const cam=String(draft["it"+i+"_camara"]||""), id=draft["it"+i+"_id"];
  if(!cam){ if(!silencio) toast("Esa cámara no tiene número"); return false; }
  for(let j=0;j<n;j++){ if(j!==i && String(draft["it"+j+"_camara"]||"")===cam){ if(!silencio) toast("La cámara "+cam+" está repetida"); return false; } }
  const vals={}; sd.campos.forEach(f=> vals[f.k]=draft["it"+i+"_"+f.k]||"");
  const errH=hembrasMal(vals); if(errH){ toast("Cámara "+cam+": "+errH); return false; }
  if(sd.estadio) vals.instar=draft["it"+i+"_instar"]||"";
  const vacio=Object.keys(vals).every(k=>!vals[k]);
  if(vacio){                                          // se vació: se retira el registro
    if(id){ state.entries=state.entries.filter(x=>x.id!==id); draft["it"+i+"_id"]=""; }
  } else {
    let e = id ? state.entries.find(x=>x.id===id) : null;
    if(e){ Object.assign(e, vals, {camara:cam, synced:false, ts:new Date().toISOString()}); }
    else {
      e=Object.assign({ id:uid(), tipo:sd.tipo, fecha:state.fecha, responsable:state.responsable,
            ts:new Date().toISOString(), synced:false, lote_id:draft.lote_id, camara:cam, grupo:draft.grupo||"",
            nota:"", duracion_min:"", hora_inicio:"", hora_fin:"", unidades_lote:"" }, sd.extra(), draft.modoFila?{modo:draft.modoFila}:{}, vals);
      sd.serie.forEach(c=> e[c.k]="");
      state.entries.push(e); draft["it"+i+"_id"]=e.id;
      if(sd.agregaLista && !state.camaras.map(String).includes(cam)){ state.camaras.push(isNaN(+cam)?cam:+cam); state.camaras.sort((a,b)=>(+a)-(+b)); }
    }
  }
  sincronizarSerie(); save(); return true;
}

function quitarCajaSerie(idx){

  bindNum(); bindTxt(); bindTiempo("Cámaras de larvas (general)");
  const nt=document.querySelector('[data-txt="nota"]');
  if(nt) nt.oninput=()=>{ draft.nota=nt.value; sincronizarSerie(); save(); };
  const gi=document.getElementById("s_grupo");
  gi.oninput=()=>{ draft.grupo=gi.value; sincronizarSerie(); save(); };
  gi.onchange=()=>{ const g=(gi.value||"").trim(); draft.grupo=g; if(g && !state.grupos.includes(g)) state.grupos.push(g); sincronizarSerie(); save(); };
  todas.forEach(c=>{
    const el=document.querySelector('.numfield[data-key="all_'+c.k+'"]');
    if(el) el.onclick=()=> openKeypad("all_"+c.k,"dec",c.lab+" · por cámara (se pone en las "+n+")",(v)=>{
      let k=0; for(let i=0;i<n;i++){ draft["it"+i+"_"+c.k]=v; if(guardarCajaSerie(i,true)) k++; }
      toast(v? (c.lab+": "+v+" en cada una de "+k+" cámaras") : (c.lab+" borrado en el grupo")); });
  });
  document.querySelectorAll("[data-allest]").forEach(b=> b.onclick=()=>{
    const v=b.dataset.allest, quitar=estTodas(v);
    for(let i=0;i<n;i++){ draft["it"+i+"_instar"]=quitar?"":v; guardarCajaSerie(i,true); }
    toast(quitar? "Estadio borrado en el grupo" : ("Todo el grupo en "+v)); render(); });

    const el=document.querySelector('.numfield[data-key="'+c.k+'"]');
    if(el) el.onclick=()=> openKeypad(c.k,"dec",c.lab,(v)=>{ draft[c.k]=v; sincronizarSerie(); save(); });
  });
  divide.forEach(c=>{
    const el=document.querySelector('.numfield[data-key="grp_'+c.k+'"]');
    if(el) el.onclick=()=> openKeypad("grp_"+c.k,"dec",c.lab+" · total del grupo (se divide entre "+n+")",(v)=>{
      const vals=nums.map((x,i)=> draft["it"+i+"_"+c.k]||"");
      const distintos=vals.some(x=>x!==vals[0]) && vals.some(x=>x!=="");
      if(distintos && v!=="" && !confirm(c.lab+": las cámaras tienen valores distintos (anotados en detallada).\n\nSe reemplazarán por "+v+" ÷ "+n+" en cada una.\n\n¿Seguir?")) return;
      const parte = v==="" ? "" : String(Math.round((+v/n)*10000)/10000);
      for(let i=0;i<n;i++){ draft["it"+i+"_"+c.k]=parte; guardarCajaSerie(i,true); }
      toast(v? (c.lab+": "+v+" ÷ "+n+" = "+parte+" por cámara") : (c.lab+" borrado en el grupo")); });
  });
  document.getElementById("fin").onclick=terminarSerie;
  document.getElementById("adet").onclick=()=>{ const id=draft.lote_id; sincronizarSerie(); save(); tReset(sd.timer); abrirSerie(id,"serie"); };

  if(e.tipo==="sito_huevo"){ const p=[]; if(e.ing_cosecha)p.push("cosecha +"+e.ing_cosecha+(e.fecha_cosecha?" ("+e.fecha_cosecha+", recosecha "+(e.recosecha||0)+")":"")); if(e.ing_compra)p.push("compra +"+e.ing_compra); if(e.egr_alimento)p.push("alimento -"+e.egr_alimento); if(e.egr_inoculo)p.push("inóculo -"+e.egr_inoculo); if(e.egr_descarte)p.push("descarte -"+e.egr_descarte); if(e.egr_otro_cant)p.push((e.egr_otro_detalle||"otro")+" -"+e.egr_otro_cant); return (p.join(" · ")||"—")+t; }

function archivables(){

  return state.entries.filter(e=> e.synced && Date.parse(e.ts||"") < limite);
}
function archivarSubidos(){
  const viejos = archivables();
  if(!viejos.length){ toast("No hay nada para archivar todavia"); return; }
  const pend = unsynced().length;
  if(!confirm("Se van a quitar "+viejos.length+" registros DE ESTE TELEFONO.\n\n"+
              "Ya estan guardados en el Sheet, asi que no se pierde nada, y los "+
              pend+" pendientes de subir NO se tocan.\n\n¿Seguir?")) return;
  const fuera = {};
  viejos.forEach(e=> fuera[e.id]=true);
  state.entries = state.entries.filter(e=> !fuera[e.id]);

}

/* =========================================================================
   LIBRO XLSX MULTI-HOJA — sin librerías, ~4 KB. Genera un .xlsx real
   (varias pestañas) que abren Excel, Google Sheets y LibreOffice.
   ========================================================================= */
var _crcT=(function(){var t=[],c,n,k;for(n=0;n<256;n++){c=n;for(k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
function _crc32(b){var c=0xFFFFFFFF;for(var i=0;i<b.length;i++)c=_crcT[(c^b[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function _utf8(s){
  if(typeof TextEncoder!=="undefined") return new TextEncoder().encode(s);
  var u=unescape(encodeURIComponent(s)),a=new Uint8Array(u.length);
  for(var i=0;i<u.length;i++)a[i]=u.charCodeAt(i);
  return a;
}
function _cat(list){var n=0,i;for(i=0;i<list.length;i++)n+=list[i].length;var o=new Uint8Array(n),p=0;for(i=0;i<list.length;i++){o.set(list[i],p);p+=list[i].length;}return o;}
function _u16(v){return new Uint8Array([v&255,(v>>8)&255]);}
function _u32(v){return new Uint8Array([v&255,(v>>8)&255,(v>>16)&255,(v>>24)&255]);}

/* ZIP sin compresión (method 0): pequeño, rápido y suficiente para XML. */
function _zip(files){
  var loc=[],cen=[],off=0,i;
  for(i=0;i<files.length;i++){
    var nm=_utf8(files[i].name), da=files[i].data, crc=_crc32(da);
    var h=_cat([_u32(0x04034b50),_u16(20),_u16(0x0800),_u16(0),_u16(0),_u16(0),
                _u32(crc),_u32(da.length),_u32(da.length),_u16(nm.length),_u16(0),nm]);
    loc.push(h,da);
    cen.push(_cat([_u32(0x02014b50),_u16(20),_u16(20),_u16(0x0800),_u16(0),_u16(0),_u16(0),
                   _u32(crc),_u32(da.length),_u32(da.length),_u16(nm.length),_u16(0),_u16(0),
                   _u16(0),_u16(0),_u32(0),_u32(off),nm]));
    off+=h.length+da.length;
  }
  var cd=_cat(cen);
  return _cat([_cat(loc),cd,_cat([_u32(0x06054b50),_u16(0),_u16(0),
    _u16(files.length),_u16(files.length),_u32(cd.length),_u32(off),_u16(0)])]);
}

function _xesc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    /* quita caracteres de control que XML no admite */
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,"");
}
function _colName(n){var s="";while(n>0){var m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-m-1)/26;}return s;}
/* Un valor es numérico solo si el texto completo es un número "limpio".
   Así "007" o "2026-05-04" se conservan como texto y no se deforman. */
function _isNum(v){
  if(typeof v==="number") return isFinite(v);
  if(typeof v!=="string") return false;
  return /^-?(0|[1-9]\d*)(\.\d+)?$/.test(v.trim()) && v.trim()!=="";
}
function _sheetXml(rows){
  var out=['<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'];
  for(var r=0;r<rows.length;r++){
    out.push('<row r="'+(r+1)+'">');
    var row=rows[r]||[];
    for(var c=0;c<row.length;c++){
      var v=row[c];
      if(v===null||v===undefined||v==="") continue;
      var ref=_colName(c+1)+(r+1);
      if(_isNum(v)) out.push('<c r="'+ref+'"><v>'+String(v).trim()+'</v></c>');
      else out.push('<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+_xesc(v)+'</t></is></c>');
    }
    out.push('</row>');
  }
  out.push('</sheetData></worksheet>');
  return out.join("");
}
/* Excel prohíbe : \ / ? * [ ] en los nombres de pestaña y limita a 31 caracteres */
function _safeName(n,used){
  var s=String(n||"Hoja").replace(/[:\\\/\?\*\[\]]/g,"-").slice(0,31)||"Hoja";
  var base=s,k=2;
  while(used.indexOf(s)>=0){ s=(base.slice(0,28)+"_"+k); k++; }
  used.push(s);
  return s;
}

/* hojas = [ {nombre:"Cosecha", filas:[[...],[...]]}, ... ]  →  Uint8Array .xlsx */
function construirXLSX(hojas){
  var used=[],names=[],i;
  for(i=0;i<hojas.length;i++) names.push(_safeName(hojas[i].nombre,used));

  var wbSheets="",wbRels="",ctOver="";
  for(i=0;i<hojas.length;i++){
    wbSheets+='<sheet name="'+_xesc(names[i])+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>';
    wbRels+='<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>';
    ctOver+='<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
  }

  var files=[
    {name:"[Content_Types].xml",data:_utf8('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
      '<Default Extension="xml" ContentType="application/xml"/>'+
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
      ctOver+'</Types>')},
    {name:"_rels/.rels",data:_utf8('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>')},
    {name:"xl/workbook.xml",data:_utf8('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '+
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'+
      '<sheets>'+wbSheets+'</sheets></workbook>')},
    {name:"xl/_rels/workbook.xml.rels",data:_utf8('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+wbRels+'</Relationships>')}
  ];
  for(i=0;i<hojas.length;i++)
    files.push({name:"xl/worksheets/sheet"+(i+1)+".xml",data:_utf8(_sheetXml(hojas[i].filas||[]))});

  return _zip(files);
}

function bajarXLSX(hojas,nombre){
  var bin=construirXLSX(hojas);
  var blob=new Blob([bin],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=nombre;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1500);
}

function csvCell(v){ v=(v==null?"":String(v)); return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function bajarCSV(rows,nombre){
  const csv=rows.map(r=>r.map(csvCell).join(",")).join("\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=nombre; a.click();
}
function exportCSV(){ if(!state.entries.length){ toast("No hay registros"); return; }
  bajarCSV([HEADERS].concat(state.entries.map(rowOf)), "insectos_"+state.fecha+".csv"); toast("CSV descargado"); }

/* --- Libro XLSX con TODAS las pestañas (reemplaza al CSV de una sola hoja) --- */
function hojasDelLibro(){
  const hojas=[];
  HOJAS.forEach(h=>{
    const filas=state.entries.filter(e=>e.tipo===h.tipo);
    if(!filas.length) return;
    hojas.push({ nombre:h.nombre, filas:[h.cols].concat(filas.map(e=>h.cols.map(c=>valOf(e,c)))) });
  });
  const t=tiemposDe(state.entries);
  if(t.length) hojas.push({ nombre:"Tiempos", filas:[HEADERS_T].concat(t.map(rowOfT)) });
  return hojas;
}
function exportXLSX(){
  if(!state.entries.length){ toast("No hay registros"); return; }
  const hojas=hojasDelLibro();
  if(!hojas.length){ toast("No hay registros"); return; }
  try{ bajarXLSX(hojas, "insectos_"+state.fecha+".xlsx"); toast(hojas.length+" hojas descargadas ✓"); }
  catch(err){ toast("No se pudo generar el XLSX — usa el CSV"); }
}
function exportCSVTiempos(){ const t=tiemposDe(state.entries);
  if(!t.length){ toast("Todavía no hay tiempos registrados"); return; }
  bajarCSV([HEADERS_T].concat(t.map(rowOfT)), "insectos_tiempos_"+state.fecha+".csv"); toast("CSV de tiempos descargado"); }

/* Hay dos caminos para enviar, y la app escoge solo:
   1) Si la página la sirve el propio Apps Script, existe un puente nativo
      (google.script.run) y no hay ningún problema de permisos entre dominios.
   2) Si no, se hace un POST "simple" (text/plain), que es el único que los
      navegadores dejan salir sin permiso previo del servidor. */
function puenteNativo(){ return (typeof google!=="undefined" && google.script && google.script.run); }
function enviarPayload(payload){
  if(puenteNativo()) return new Promise((ok,err)=>{
    google.script.run.withSuccessHandler(r=>ok(r||"ok")).withFailureHandler(err).guardarRegistros(JSON.stringify(payload));
  });
  if(!CONFIG.SCRIPT_URL) return Promise.reject(new Error("Falta la URL del Apps Script"));
  const cuerpo=JSON.stringify(payload);
  return fetch(CONFIG.SCRIPT_URL,{ method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
                                   body:cuerpo, redirect:"follow" })
    .then(r=>{ if(!r.ok) throw new Error("El servidor respondió "+r.status); return r.text().then(()=> "ok"); })
    .catch(()=> fetch(CONFIG.SCRIPT_URL,{ method:"POST", mode:"no-cors",
                        headers:{"Content-Type":"text/plain;charset=utf-8"}, body:cuerpo }).then(()=>"ciego"));
}
function explicarFallo(err){
  const detalle=String((err&&err.message)||err||"desconocido");
  if(location.protocol==="file:"){
    alert("No se pudo enviar porque la app está abierta como ARCHIVO SUELTO (file://).\n\n"+
      "Los navegadores no dejan que un archivo guardado en el celular le mande datos a Google. "+
      "Por eso salía «sin conexión» aunque tuvieras internet.\n\n"+
      "SOLUCIÓN: abre la app desde el enlace https que da Apps Script "+
      "(Implementar → Aplicación web → Cualquier usuario) en vez de abrir el archivo descargado.\n\n"+
      "Tranquilo: nada se perdió. Todo sigue guardado aquí y puedes bajar el libro XLSX.");
  } else if(!navigator.onLine){
    toast("Sin internet — quedó pendiente");
  } else {
    alert("No se pudo enviar a Sheets.\n\nDetalle: "+detalle+"\n\n"+
      "Revisa en Apps Script → Implementar → Gestionar implementaciones que:\n"+
      "· «Quién tiene acceso» esté en Cualquier usuario\n"+
      "· la URL /exec de la app sea la de la implementación activa\n\n"+
      "Tus registros siguen guardados aquí; también puedes bajar el libro XLSX.");
  }
  render();
}
function syncSheets(){
  const pend=unsynced();
  if(!pend.length){ toast("Nada pendiente"); return; }
  if(!CONFIG.SCRIPT_URL && !puenteNativo()){ toast("Falta la URL del Apps Script → usa XLSX"); return; }
  const payload=pend.map(e=>{ const o=Object.assign({},e); delete o.synced; const w=semanaDe(o); if(w!=="") o.semana=w; return o; }).concat(tiemposDe(pend));
  toast("Enviando…");
  enviarPayload(payload)
    .then(res=>{ pend.forEach(e=>e.synced=true); save();
      toast(res==="ciego" ? "Enviado — confirma en el Sheet" : "Subido a Sheets ✓"); render(); })
    .catch(explicarFallo);
}

/* =========================================================================
   FUNCIONAR SIN SEÑAL
   El service worker guarda una copia de la app en el celular. Después de la
   primera vez con internet, la app abre igual aunque no haya señal.
   ========================================================================= */
var SW_ESTADO = "no soportado", SW_REG = null;
function registrarSW(){
  if(!("serviceWorker" in navigator)){ SW_ESTADO = "el navegador no lo soporta"; return; }
  if(location.protocol === "file:"){ SW_ESTADO = "no aplica (archivo suelto)"; return; }
  navigator.serviceWorker.register("./sw.js")
    .then(function(reg){
      SW_REG = reg; SW_ESTADO = "activo";
      reg.addEventListener("updatefound", function(){
        var nuevo = reg.installing;
        if(!nuevo) return;
        nuevo.addEventListener("statechange", function(){
          /* Solo avisa si YA había una versión antes; en la primera visita no molesta. */
          if(nuevo.state === "installed" && navigator.serviceWorker.controller){
            SW_ESTADO = "hay una versión nueva";
            toast("Hay una versión nueva — cierra y vuelve a abrir");
          }
        });
      });
    })
    .catch(function(e){ SW_ESTADO = "falló: " + e.message; });
}

/* Envío automático: al volver la señal sube solo lo que quedó pendiente. */
var reintentando = false;
function intentarEnvioAuto(){
  if(reintentando) return;
  if(!navigator.onLine) return;
  if(typeof unsynced !== "function" || !unsynced().length) return;
  if(location.protocol === "file:") return;   // ahí el envío está bloqueado por el navegador
  reintentando = true;
  try { syncSheets(); } catch(e){}
  setTimeout(function(){ reintentando = false; }, 8000);
}
window.addEventListener("online", function(){ toast("Volvió la señal — enviando…"); intentarEnvioAuto(); });

/* =========================================================================
   PANTALLA DE DIAGNÓSTICO  (botón "estado" abajo a la derecha)
   Responde de una: ¿por qué no está subiendo?
   ========================================================================= */
/* ---- Enlace al Google Sheet ----------------------------------------------
   Se puede dejar escrito en CONFIG.SHEET_URL, o pegarlo desde la app.
   Lo pegado se guarda en el celular y manda sobre lo escrito en CONFIG. */
var SHEET_KEY = LS_KEY + "_sheet";
function sheetURL(){
  try { var v = localStorage.getItem(SHEET_KEY); if(v) return v; } catch(e){}
  return CONFIG.SHEET_URL || "";
}
function abrirSheet(){
  var u = sheetURL();
  if(!u){ configurarSheet(); return; }
  window.open(u, "_blank");
}
function configurarSheet(){
  var actual = sheetURL();
  var u = prompt("Pega la dirección del Google Sheet\n(la que empieza por https://docs.google.com/spreadsheets/...)", actual || "");
  if(u === null) return;                       // canceló
  u = String(u).trim();
  if(u === ""){                                 // lo borró: vuelve a lo de CONFIG
    try { localStorage.removeItem(SHEET_KEY); } catch(e){}
    toast("Enlace borrado"); estadoApp(); return;
  }
  if(!/^https:\/\/docs\.google\.com\/spreadsheets\//.test(u)){
    alert("Esa no parece la dirección de un Google Sheet.\n\nDebe empezar por:\nhttps://docs.google.com/spreadsheets/\n\nOjo: NO es la dirección que termina en /exec.");
    return;
  }
  try { localStorage.setItem(SHEET_KEY, u); } catch(e){}
  toast("Enlace guardado ✓"); estadoApp();
}
function instalada(){
  try {
    if(navigator.standalone) return true;                       // iOS
    if(window.matchMedia) return window.matchMedia("(display-mode: standalone)").matches;
  } catch(e){}
  return false;
}
function cerrarDiag(){ document.getElementById('diag').className = ''; }
function estadoApp(){
  var pend = (typeof unsynced === "function") ? unsynced().length : "?";
  var total = (state && state.entries) ? state.entries.length : "?";
  var archivo = (location.protocol === "file:");
  var f = [
    ["Versión de la app", window.__VER, true],
    ["Instalada en pantalla de inicio",
      instalada() ? "sí" : "no — ábrela desde el ícono", instalada()],
    ["Cómo está abierta", archivo ? "archivo suelto (file://)" : location.origin, !archivo],
    ["Señal ahora", navigator.onLine ? "hay internet" : "sin internet", navigator.onLine],
    ["Copia para uso sin señal", SW_ESTADO, SW_ESTADO === "activo"],
    ["URL del Apps Script", CONFIG.SCRIPT_URL ? "configurada" : "FALTA", !!CONFIG.SCRIPT_URL],
    ["Enlace al Google Sheet", sheetURL() ? "configurado" : "sin configurar", !!sheetURL()],
    ["Registros guardados aquí", String(total), true],
    ["Pendientes de subir", String(pend), pend === 0],
    ["Fallas detectadas", window.__fallas.length ? window.__fallas.join(" | ") : "ninguna",
      window.__fallas.length === 0]
  ];
  var html = '<h3>Estado de la app</h3>';
  f.forEach(function(x){
    html += '<div class="fila"><b>' + x[0] + '</b><span class="' + (x[2] ? "ok" : "mal") + '">'
         +  String(x[1]).replace(/</g,"&lt;") + '</span></div>';
  });
  if(archivo){
    html += '<div class="fila" style="border:none"><span class="mal">La app está abierta como archivo '
         +  'descargado. Así el navegador NO deja enviar a Google ni guardar la copia sin señal. '
         +  'Ábrela desde su enlace de internet.</span></div>';
  }
  html += '<button onclick="intentarEnvioAuto()">Intentar enviar ahora</button>';
  if(sheetURL()) html += '<button class="gris" onclick="abrirSheet()">Abrir el Google Sheet</button>';
  html += '<button class="gris" onclick="configurarSheet()">'
       +  (sheetURL() ? "Cambiar el enlace del Sheet" : "Configurar enlace del Sheet") + '</button>';
  html += '<button class="gris" onclick="cerrarDiag()">Cerrar</button>';
  var d = document.getElementById("diag");
  d.innerHTML = html; d.className = "show";
}
(function(){
  var b = document.createElement("button");
  b.id = "verbtn"; b.textContent = "estado";
  b.onclick = estadoApp;
  document.body.appendChild(b);
})();

registrarSW();
setTimeout(intentarEnvioAuto, 3000);
